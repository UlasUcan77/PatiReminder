services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pati
      POSTGRES_PASSWORD: pati
      POSTGRES_DB: patireminder
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pati"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["full"]
    environment:
      DATABASE_URL: postgresql://pati:pati@postgres:5432/patireminder
      REDIS_URL: redis://redis:6379
      # Read from your shell or a root .env file; the API refuses to start without it.
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
