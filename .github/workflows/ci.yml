name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pati
          POSTGRES_PASSWORD: pati
          POSTGRES_DB: patireminder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pati"
          --health-interval 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pati:pati@localhost:5432/patireminder_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Apply database migrations
        run: npm run db:deploy -w @patireminder/api

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile .
